# Replace only the maimai.diving-fish.com server's existing location /.
# Keep existing API, manual, covers and favicon locations.
location / {
    root /var/www/maimaidx/web/current;
    index index.html;
    try_files $uri $uri/ @legacy_web;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
}

# Keep the running Docker frontend as a migration fallback. Old tabs may still
# request its js/css/font URLs; new HTML references the versioned CDN instead.
location @legacy_web {
    proxy_pass http://127.0.0.1:8080;
}

# Versioned, fully verified local copies. Local fallback CSS references this
# same-origin directory, so fonts do not depend on CDN CORS.
location /web-assets/ {
    alias /var/www/maimaidx/web/releases/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
}

# Downloading and validating a release may take longer than a normal API call.
location = /api/maimaidxprober/ci/production {
    proxy_pass http://127.0.0.1:8333/ci/production;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 256k;
    proxy_read_timeout 330s;
}
